<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Mars Survival Tycoon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="topbar">
        <div class="title-block">
            <div class="title">MARS SURVIVAL TYCOON</div>
            <div class="subtitle">Build • Survive • Automate • Export</div>
        </div>

        <div id="resources">
            <div class="resource"><span>💰</span><b id="credits">1200</b></div>
            <div class="resource"><span>⛏</span><b id="iron">0</b></div>
            <div class="resource"><span>💧</span><b id="water">60</b></div>
            <div class="resource"><span>🫁</span><b id="oxygen">100</b></div>
            <div class="resource"><span>⚡</span><b id="power">60</b></div>
            <div class="resource"><span>👨‍🚀</span><b id="population">3</b></div>
        </div>
    </div>

    <div id="buildPanel">
        <div id="buildHeader">BUILD</div>
        <div id="buildMenu"></div>
    </div>

    <div id="actionBar">
        <button class="image-action" id="sellBtn" title="Sell 10 iron">
            <img src="Assets/sprites/ui_sell_button.png" alt="Sell">
        </button>
        <button class="image-action" id="demolishBtn" title="Demolish selected building">
            <img src="Assets/sprites/ui_demolish_button.png" alt="Demolish">
        </button>
        <button class="image-action" id="pauseBtn" title="Pause">
            <img src="Assets/sprites/ui_pause_button.png" alt="Pause">
        </button>
        <button class="image-action" id="speedBtn" title="Fast speed">
            <img src="Assets/sprites/ui_fast_button.png" alt="Fast">
        </button>
        <button class="image-action" id="menuBtn" title="Sprite catalog">
            <img src="Assets/sprites/ui_menu_button.png" alt="Menu">
        </button>
    </div>

    <canvas id="game"></canvas>

    <div id="status">Loading Mars colony assets…</div>

    <div id="catalog" class="hidden">
        <div class="catalog-card">
            <button id="closeCatalog">×</button>
            <h2>Colony Sprite Catalog</h2>
            <p>Every game sprite currently available in the repository.</p>
            <div id="catalogGrid"></div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
